<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
  <style>
    fieldset {
        border: 2px solid #000000;
    }
  </style>
</head>
<body>
    <form action="task1.html" method="post">
    <fieldset>
        <legend>Персональна інформація</legend>
        <label for="name">Name<span style="color: red;">*</span></label><br>
        <input type="text" id="name" name="name" placeholder="your name" required><br>
        <label for="email">Email<span style="color: red;">*</span></label><br>
        <input type="email" id="email" name="email" placeholder="your email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required>
    </fieldset>

        <fieldset>
            <legend>Додаткова інформація</legend>
            <span>Стать:<span style="color: red;">*</span></span><br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Чоловік</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Жінка</label><br><br>

            <span>Поточний статус:</span><br>
            <input type="checkbox" id="student" name="status" value="student">
            <label for="student">Студент</label><br>
            <input type="checkbox" id="emploed" name="status" value="emploed">
            <label for="emploed">Працівник</label><br>
            <input type="checkbox" id="unemploed" name="status" value="unemploed">
            <label for="unemploed">Безробітний</label><br><br>

            <label for="birthday">Дата народження:<span style="color: red;">*</span></label><br>
            <input type="date" id="birthday" name="birthday" required><br><br>

            <label for="skillsAndTech">Навички та технології:<span style="color: red;">*</span></label><br>
            <select id="skillsAndTech" name="skillsAndTech" multiple size="7" required>
                <optgroup label="Tech skills">
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="ASP.NET">ASP.NET</option>
                </optgroup>
                <optgroup label="Soft skills">
                    <option value="time management">Тайм-менеджмент</option>
                    <option value="teamwork">Командна робота</option>
                    <option value="leadership">Лідерство</option>
                </optgroup>
            </select><br><br>

            <label for="expirience">Досвід (в роках):</label><br>
            <input type="number" id="expirience" name="expirience" min="0" max="25" step="0.5">
            <label for="expirience">років</label><br><br>
            
            <label for="image">Фотографія:</label><br>
            <input type="file" id="image" name="image" accept="image/*"><br><br>

            <label for="comments">Коментарій:</label><br>
            <textarea id="comments" name="comments" rows="4" cols="50" ></textarea><br><br>
        </fieldset>
        <input type="submit" value="Відправити" onclick="alert('Форма відправлена!')">
        <input type="reset" value="Скинути">
    </form>
</body>
</html>
